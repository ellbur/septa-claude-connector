[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "septa-mcp"
version = "0.1.0"
description = "MCP connector for SEPTA Regional Rail, Metro and buses: GTFS schedules plus real-time status"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.3,<3",
    "anyio>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
septa-mcp = "septa_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["septa_mcp"]
