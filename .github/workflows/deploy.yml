# Deploys to Cloud Run (deploy.sh) whenever the deploy branch is pushed.
#
# GitHub signs in to Google Cloud through Workload Identity Federation, so no key is stored
# anywhere. Run setup-github-deploy.sh once to create the identity pool and the deployer
# account, then set the repository variables it prints (Settings > Secrets and variables >
# Actions > Variables): GCP_PROJECT, GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT, and
# optionally GCP_REGION.
name: Deploy

on:
  push:
    branches: [deploy]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - run: ./deploy.sh
        env:
          PROJECT: ${{ vars.GCP_PROJECT }}
          REGION: ${{ vars.GCP_REGION || 'us-east4' }}
